# Pipeline CI/CD para OctaBridge usando GitHub Actions
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/**
jobs:
 test:
  runs-on: ubuntu-latest
  services:
    postgres:
      image: postgres:latest
      ports:
        - 5432:5432
      options: >-
        --health-cmd="pg_isready -U postgres"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=5
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: test_db
  steps:
    - name: Checkout code  # Descarga el código fuente
      uses: actions/checkout@v3

    - name: Set up Python  # Configura Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies  # Instala dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r skill_datasaver_multi/requirements.txt

    - name: Set PYTHONPATH  # Asegura que el root esté en el path de Python
      run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..10}; do
          nc -z localhost 5432 && echo "PostgreSQL is ready" && exit 0
          echo "Waiting for PostgreSQL..."
          sleep 3
        done
        exit 1

    - name: Run tests  # Ejecuta los tests con cobertura
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: pytest tests/ --cov=skill_datasaver_multi --cov-report=term-missing
      
 build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image for skill-nlpclassify  # Construye imagen Docker para NLP
        run: docker build -t skill-nlpclassify -f skill-nlpclassify/Dockerfile .

      - name: Build Docker image for skill-notifyslack  # Construye imagen Docker para notificaciones
        run: docker build -t skill-notifyslack -f skill-notifyslack/Dockerfile .

 deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to IBM Cloud  # Paso placeholder para despliegue
        run: echo "Deploying to IBM Cloud"

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image for skill-nlpclassify
        run: docker build -t skill-nlpclassify -f skill-nlpclassify/Dockerfile .

      - name: Build Docker image for skill-notifyslack
        run: docker build -t skill-notifyslack -f skill-notifyslack/Dockerfile .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to IBM Cloud
        run: echo "Deploying to IBM Cloud"

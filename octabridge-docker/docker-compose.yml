version: '3.8' # Se recomienda usar una versión reciente y compatible. 3.8 es común.

services:
  # Servicio para skill-intakebasic (¡NO BORRADO, AQUÍ ESTÁ!)
  intake-basic:
    build:
      context: ../skill_intakebasic # Ruta relativa a la carpeta de skill_intakebasic
      dockerfile: Dockerfile # Nombre del Dockerfile dentro de esa carpeta
    container_name: octabridge-intake-basic # Nombre del contenedor para fácil identificación
    restart: unless-stopped # Política de reinicio: el contenedor se reiniciará a menos que se detenga explícitamente.
    # Nota: skill-intakebasic es un script que ejecuta pruebas y termina, por eso no necesita puertos expuestos.
    # Puedes añadir límites de recursos a intake-basic también, similar a dataset-loader si lo deseas:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M # Ejemplo de límite para intake-basic
    #       cpus: '0.25'

  # Servicio para skill-datasetloader (con optimizaciones de recursos y ruta corregida)
  dataset-loader:
    build:
      # *** RUTA CORREGIDA: Usando el guion '-' en 'skill-datasetloader' ***
      context: C:/Users/belfo/Documents/GitHub/octabridge-poc/skill-datasetloader
      dockerfile: Dockerfile # Nombre del Dockerfile dentro de esa carpeta
    container_name: octabridge-dataset-loader # Nombre único para el contenedor
    restart: unless-stopped # Mantener el servicio corriendo (es una API Flask)
    ports:
      # Mapea el puerto 3001 de tu máquina host al puerto 3001 del contenedor.
      # Así podrás acceder a la API desde tu máquina local en http://localhost:3001
      - "3001:3001"
    environment:
      # Tus credenciales HMAC para IBM COS.
      # ¡IMPORTANTE! Reemplaza los valores de ejemplo con tus credenciales REALES.
      COS_ACCESS_KEY_ID: "ef85e41b58dc4518a8e387bd6f2c7c744" # <-- ¡Pon tu clave real aquí!
      COS_SECRET_ACCESS_KEY: "b79083b77a90f97f2bd6fc3e3cb5e19a695387e51b43eb49" # <-- ¡Pon tu secreto real aquí!
      COS_BUCKET_NAME: "ibm-cos-bucket" # <-- ¡Pon tu nombre de bucket real aquí!
      COS_REGION: "ca-tor" # <-- ¡Pon tu región real aquí!
      COS_ENDPOINT: "https://s3.ca-tor.cloud-object-storage.appdomain.cloud" # <-- ¡Pon tu endpoint real aquí!
    # --- INICIO DE CAMBIOS PARA OPTIMIZACIÓN DE RECURSOS ---
    deploy:
      resources:
        limits:
          memory: 512M # Límite de memoria: 512 Megabytes
          cpus: '0.5'  # Límite de CPU: 0.5 de un núcleo de CPU
        reservations: # Opcional: reservar un mínimo de recursos
          memory: 256M # Reserva de memoria: 256 Megabytes
          cpus: '0.25' # Reserva de CPU: 0.25 de un núcleo de CPU
    # --- FIN DE CAMBIOS ---
    # depends_on: # Descomentar y listar si dataset-loader depende de otro servicio (ej. una base de datos)
    #   - some_database_service